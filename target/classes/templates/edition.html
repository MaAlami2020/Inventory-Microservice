<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/css/bulma.min.css">
    <link rel="stylesheet" href="/css/material-design-iconic-font.css">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Avenue Fashion</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <nav class="nav-menu --nav-dark" id="mySidenav">
                <a class="is-hidden-mobile brand is-uppercase has-text-weight-bold has-text-light" href="/">Avenue Fashion</a>
                <ul class="nav-menu-ul">
                    <li class="nav-menu-item has-text-white"><a href="/items/{{id}}/{{category}}/stock" class="nav-menu-link">Edit {{category}}</a></li>
                </ul>
            </nav>
        </nav>
    </header>
    <!-- Banner -->
    <div class="banner banner-second">
        <div class="banner-container">
            <h1>Current item</h1>
            <div class="columns">
                <div class="column">
                    <img src="//localhost:8443/api/items/{{id}}/image" alt="" width="200" height="200"></img>
                </div>
                <div class="column" id="item">
                </div>
            </div>
        </div>
    </div>


<form action="/items/{{id}}/update" method="post" class="form-control" enctype="multipart/form-data">
    <div class="container">
        <div class="columns">
            <div class="column is-two-fifths-desktop">
                <div class="slider" id="slider">
                    <div class="slider-img-container">
                        <img src="/img/no_t-shirt.PNG" alt="camiseta" class="active slider-item">
                    </div>
                </div>
                <input type='file' name='imageField' accept=".jpg, .jpeg, .png"/>
            </div>  
            <div class="column">
                <h3 class="is-size-4">New item</h3>
                <div class="columns">
                    <div class="column">
                        <input type="text" name="name" placeholder="name" class="form-control-field"/>
                    </div>
                    <div class="column">
                        <input type="number" name="price" placeholder="price" class="form-control-field" min="0" step="0.01"/>
                    </div>
                </div>

                <div class="columns is-multiline">
                    <div class="column is-one-third">
                        <label for="quality">Code:</label>
                        <input type="text" name="code" placeholder="item new code" class="form-control-field" minlength="3">         
                    </div>
                    <div class="column is-one-third">
                        <label for="color">Gender:</label>
                        <div class="form-control-field" id="gender">
                            {{#genders}}
                            <label><input type="radio" name="gender" value="{{.}}"/> {{.}}</label>
                            {{/genders}}
                        </div>
                    </div>
                    <div class="column is-one-third">
                        <label for="size">Type:</label>  
                        <div class="form-control-field" id="type">
                            {{#types}}
                            <label><input type="radio" name="type" value="{{.}}"/> {{.}}</label>
                            {{/types}}
                            <!--aplicar factory method para crear instancias segun el tipo de producto-->
                        </div>
                    </div>
                </div>

                <div class="columns is-multiline">
                    <div class="column is-full is-marginless">
                        <button class="btn btn-default btn-outline">save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="columns is-tablet">
            <div class="column">
                <div class="tabs-container">                
                    <div class="tabs-panels">
                        <div class="tab-panel active-panel">
                            <div class="container">
                                <div class="columns">
                                    <div class="column">
                                        <h2 class="is-size-4">Additional information</h2>
                                        <textarea name="description" placeholder="description" class="form-control-field"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>                      
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>


</div>
    <!-- footer -->
    <footer class="footer">
        <div class="footer-bar-top">
            <div class="container">
                <a class="footer-bar-top-links" href="#">2024 Avenue Fashion</a>
            </div>
        </div>
    </footer>
    <script src="/js/main.js"></script>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>

</body>
<script>

    let ruta='/api/inventory/items/{{id}}';

    function loadItem(callback){
        $.ajax({
            url:ruta
        }).done(function(item){
            callback(item);
        })
    }

    function showItemLoaded(item){
        $('#item').append('<p class="has-text-white"><strong class="has-text-grey-light">Code: </strong>' + item.code + '</p>' +
                    '<p class="has-text-white"><strong class="has-text-grey-light">Name: </strong>' + item.name + '</p>' +
                    '<p class="has-text-white"><strong class="has-text-grey-light">Price: </strong>' + item.price + ' €</p>' +
                    '<p class="has-text-white"><strong class="has-text-grey-light">Gender: </strong>' + item.gender + '</p>' +
                    '<p class="has-text-white"><strong class="has-text-grey-light">Type: </strong>' + item.type + '</p>' +
                    '<p class="has-text-white"><strong class="has-text-grey-light">Description: </strong>' + item.description + '</p>'
        )
    }

    $(document).ready(function(){

        loadItem(function(item){
            showItemLoaded(item);
        })

    })
</script>
</html>
