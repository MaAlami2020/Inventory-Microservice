<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/css/bulma.min.css">
    <link rel="stylesheet" href="/css/material-design-iconic-font.css">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Avenue Fashion</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <nav class="nav-menu --nav-dark" id="mySidenav">
                <a class="is-hidden-mobile brand is-uppercase has-text-weight-bold has-text-white" href="/">Avenue Fashion</a>
                <ul class="nav-menu-ul"></ul>
            </nav>
        </nav>
    </header>
    <!-- Banner -->
    <div class="banner banner-second">
        <div class="banner-container">
        </div>
    </div>

<div>
<form action="/items/clothes/new" method="post" class="form-control" enctype="multipart/form-data">
    <div class="container">
        <div class="columns">
            <div class="column is-two-fifths-desktop">
                <div class="slider" id="slider">
                    <div class="slider-img-container">
                        <img src="/img/no_t-shirt.PNG" alt="camiseta" class="active slider-item">
                    </div>
                </div>
                <input type='file' name='imageField' accept=".jpg, .jpeg, .png" required/>
            </div>
            <div class="column">
                <h3 class="is-size-3">New item</h3>
                <div class="columns">
                    <div class="column">
                        <input type="text" name="name" placeholder="name" class="form-control-field" required/>
                    </div>
                    <div class="column">
                        <input type="number" name="price" placeholder="price" class="form-control-field" min="0" step="0.01" required/>
                    </div>
                </div>

                <div class="columns is-multiline">
                    <div class="column is-one-third">
                        <label for="color">Gender</label>
                        <div class="form-control-field" id="gender">
                            {{#genders}}
                            <label><input type="radio" name="gender" value="{{.}}" required/> {{.}}</label>
                            {{/genders}}
                        </div>
                    </div>
                    <div class="column is-one-third">
                        <label for="size">Type</label>
                        <div class="form-control-field" id="type">
                            {{#types}}
                            <label><input type="radio" name="type" value="{{.}}" required> {{.}}</label>
                            {{/types}}
                        </div>
                    </div>
                </div>  
                
                <div class="columns is-multiline">
                    <div class="column is-full is-marginless">
                        <button class="btn btn-default btn-outline">add stock</button>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="container">
        <div class="columns is-tablet">
            <div class="column">
                <div class="tabs-container">                
                    <div class="tabs-panels">
                        <div class="tab-panel active-panel">
                            <div class="container">
                                <div class="columns">
                                    <div class="column">
                                        <h2 class="is-size-4">Additional information</h2>
                                        <textarea name="description" placeholder="description" class="form-control-field"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>                      
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
</div>

    <!-- footer -->
    <footer class="footer">
        <div class="footer-bar-top">
            <div class="container">
                <a class="footer-bar-top-links" href="#">2024 Avenue Fashion</a>
            </div>
        </div>
    </footer>
    <script src="/js/main.js"></script>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>

</body>
</html>
